name: refresh uv lock once

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml
      - .github/workflows/refresh-uv-lock-once.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Regenerate lock
        run: uv lock
      - name: Commit regenerated lock
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "Refresh uv lock for complete runtime sync"
          git push
