name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install remote backend dependencies
        run: python -m pip install -r dataset/requirements-remote.txt ".[model]"
      - name: Compile production modules
        run: python -m compileall -q dataset trainer modal tests
      - name: Run checkpoint transport regressions
        run: >-
          python -m unittest -v
          tests.test_hf_bucket_checkpoint
          tests.test_trainer_remote_publication
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee test-results.log
      - name: Annotate unit test failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("test-results.log")
          text = path.read_text(encoding="utf-8", errors="replace") if path.is_file() else "test-results.log is missing"
          tail = "\n".join(text.splitlines()[-80:])
          escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error title=Unit test failure::{escaped[:12000]}")
          PY
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results.log
          if-no-files-found: error
