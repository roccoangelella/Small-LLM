name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install remote backend dependencies
        run: python -m pip install -r dataset/requirements-remote.txt ".[model]"
      - name: Compile production modules
        run: python -m compileall -q dataset tests
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -v 2>&1 | tee test-results.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results.log
          if-no-files-found: error
