[project]
name = "small-llm"
version = "0.1.0"
description = "Deterministic corpus pipeline, hybrid decoder, and training system for a sub-1B language model."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
model = [
    "torch>=2.7.0",
    "fla-core==0.5.2",
    # fla.utils._compat imports packaging at runtime, but the upstream core
    # package does not currently declare it. Keep the qualified CUDA extra
    # self-contained instead of relying on Kaggle's system site-packages.
    "packaging>=24",
    # PyTorch initializes NumPy interop during import; the isolated uv model
    # environment should not depend on Kaggle's global Python environment.
    "numpy>=2.1,<3",
]
fla = [
    "torch>=2.7.0",
    "fla-core==0.5.2",
    "packaging>=24",
    "numpy>=2.1,<3",
]
post-training = [
    "torch>=2.7.0",
    "huggingface-hub>=1.5,<2",
    "tiktoken>=0.9.0",
]

[project.scripts]
small-llm-eval-data = "dataset.eval_core_cli:main"
small-llm-eval = "trainer.eval_entrypoint:main"
small-llm-sft-data = "post_training.sft.cli:main"
small-llm-sft-train = "post_training.sft.train_cli:main"
small-llm-sft-eval = "post_training.sft.eval_suite:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataset*", "model*", "trainer*", "post_training*"]
exclude = ["tests*"]

[tool.uv]
# Dataset production remains standard-library-only. Model and trainer code use
# explicit extras so dataset-only installations stay lightweight.
