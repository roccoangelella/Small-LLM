[project]
name = "small-llm"
version = "0.1.0"
description = "Cluster-filtered, token-only Nemotron-ClimbMix corpus pipeline for a sub-1B pretraining model."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
model = [
    "torch>=2.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataset*", "model*"]
exclude = ["tests*"]

[tool.uv]
# The production pipeline uses only the Python standard library (urllib, json,
# hashlib, array, mmap, struct, random).  No third-party runtime dependencies
# are required, which keeps the lockfile trivial and the build reproducible.
