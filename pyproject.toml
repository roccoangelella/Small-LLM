[project]
name = "small-llm"
version = "0.1.0"
description = "Deterministic corpus pipeline, hybrid decoder, and training system for a sub-1B language model."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
model = [
    "torch>=2.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataset*", "model*", "trainer*"]
exclude = ["tests*"]

[tool.uv]
# Dataset production remains standard-library-only. Model and trainer code use
# the explicit `model` extra so dataset-only installations stay lightweight.
