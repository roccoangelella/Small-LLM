[project]
name = "small-llm"
version = "0.1.0"
description = "Deterministic corpus pipeline, hybrid decoder, and training system for a sub-1B language model."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
model = [
    "torch>=2.7.0",
]
post-training = [
    "torch>=2.7.0",
    "huggingface-hub>=0.34.0",
    "tiktoken>=0.9.0",
]

[project.scripts]
small-llm-eval-data = "dataset.eval_core:main"
small-llm-eval = "trainer.eval_suite:main"
small-llm-sft-data = "post_training.sft.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataset*", "model*", "trainer*", "post_training*"]
exclude = ["tests*"]

[tool.uv]
# Dataset production remains standard-library-only. Model and trainer code use
# explicit extras so dataset-only installations stay lightweight.
