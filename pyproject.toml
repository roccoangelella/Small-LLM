[project]
name = "small-llm"
version = "0.1.0"
description = "Deterministic corpus pipeline, hybrid decoder, and training system for a sub-1B language model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beam-client==0.2.207",
    "dotenv>=0.9.9",
    "fla-core==0.5.2",
    "numpy>=2.1,<3",
    "packaging>=24",
    "torch>=2.7.0",
]

[project.optional-dependencies]
model = [
    "torch>=2.7.0",
    "fla-core==0.5.2",
    "packaging>=24",
    "numpy>=2.1,<3",
]
fla = [
    "torch>=2.7.0",
    "fla-core==0.5.2",
    "packaging>=24",
    "numpy>=2.1,<3",
]
post-training = [
    "torch>=2.7.0",
    "huggingface-hub>=1.5,<2",
    "tiktoken>=0.9.0",
]
beam = ["beam-client==0.2.207"]

[dependency-groups]
runtime = [
    "huggingface-hub>=1.5,<2",
    "tiktoken>=0.9.0",
    "wandb==0.26.1",
]

[project.scripts]
small-llm-eval-data = "dataset.eval_core_cli:main"
small-llm-eval = "trainer.eval_entrypoint:main"
small-llm-sft-data = "post_training.sft.cli:main"
small-llm-sft-train = "post_training.sft.train_cli:main"
small-llm-sft-eval = "post_training.sft.eval_suite:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataset*", "model*", "trainer*", "post_training*"]
exclude = ["tests*"]

[tool.uv]
default-groups = ["runtime"]
